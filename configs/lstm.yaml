model: lstm
d_model: 128
n_layers: 2
dropout: 0.2

lr: 0.001
pos_weight: 50.0
weight_decay: 0.0001
batch_size: 256
epochs: 50
patience: 10
lr_scheduler: cosine
clip_grad: 1.0

# 13 步预报场 → 12 步预测
L: 13
H: 12
max_train_samples: 200000
max_val_samples: 40000
max_test_samples: 40000

save_dir: checkpoints/lstm
cell_index: Data/processed/dataset/cell_index.csv
dataset_dir: Data/processed/dataset
